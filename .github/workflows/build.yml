name: build

on:
  push:
  pull_request:

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # SDL3 is compiled from source via FetchContent; cache the fetched
      # sources + build products so pushes don't pay that cost every time.
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: out/build/x64-Release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build --preset x64-release

      - name: Selftest (save round-trip, headless)
        run: out/build/x64-Release/bin/voxel-factory.exe --selftest

      # The bin folder is self-contained (exe + SDL3.dll + shaders/ + assets/),
      # so every green build doubles as a distributable zip.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: voxel-factory-win64
          path: out/build/x64-Release/bin/

  macos-release:
    runs-on: macos-latest # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: brew install ninja

      # "univ" in the key: a cached arm64-only SDL3 tree from before the
      # universal switch must not poison the fat link.
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: out/build/mac-Release/_deps
          key: deps-${{ runner.os }}-univ-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset mac-release

      - name: Build
        run: cmake --build --preset mac-release

      # The artifact must run on Intel and Apple Silicon alike.
      - name: Assert universal binary
        run: |
          lipo -archs out/build/mac-Release/bin/voxel-factory
          lipo -archs out/build/mac-Release/bin/voxel-factory | grep -q x86_64
          lipo -archs out/build/mac-Release/bin/voxel-factory | grep -q arm64

      - name: Selftest (save round-trip, headless)
        run: out/build/mac-Release/bin/voxel-factory --selftest

      # Tar first: upload-artifact's zip strips the executable bit, a tarball
      # keeps the bin folder runnable straight after download + untar.
      - name: Pack build
        run: tar -czf voxel-factory-mac.tar.gz -C out/build/mac-Release bin

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: voxel-factory-mac
          path: voxel-factory-mac.tar.gz

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SDL3 is built from source, so it needs the windowing/input/GL headers
      # at configure time — it silently drops whichever backend it can't find.
      # Audio dev packages are NOT needed by us (miniaudio dlopen()s ALSA and
      # PulseAudio at runtime); they are here so SDL's own audio backends
      # build too, keeping the artifact's capabilities the same as a distro
      # build's.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev \
            libasound2-dev libpulse-dev

      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: out/build/linux-Release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Selftest (save round-trip, headless)
        run: out/build/linux-Release/bin/voxel-factory --selftest

      # $ORIGIN must be on the exe's RUNPATH or the shipped libSDL3.so.0 next
      # to it won't be found once the folder moves off this runner.
      - name: Assert relocatable rpath
        run: |
          readelf -d out/build/linux-Release/bin/voxel-factory | grep -E 'RPATH|RUNPATH'
          readelf -d out/build/linux-Release/bin/voxel-factory | grep -q '$ORIGIN'

      # Tar first: upload-artifact's zip strips the executable bit, a tarball
      # keeps the bin folder runnable straight after download + untar.
      - name: Pack build
        run: tar -czf voxel-factory-linux.tar.gz -C out/build/linux-Release bin

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: voxel-factory-linux
          path: voxel-factory-linux.tar.gz
