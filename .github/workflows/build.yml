name: build

on:
  push:
  pull_request:

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # SDL3 is compiled from source via FetchContent; cache the fetched
      # sources + build products so pushes don't pay that cost every time.
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: out/build/x64-Release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build --preset x64-release

      - name: Selftest (save round-trip, headless)
        run: out/build/x64-Release/bin/voxel-factory.exe --selftest

      # The bin folder is self-contained (exe + SDL3.dll + shaders/ + assets/),
      # so every green build doubles as a distributable zip.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: voxel-factory-win64
          path: out/build/x64-Release/bin/

  macos-release:
    runs-on: macos-latest # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: brew install ninja

      # "univ" in the key: a cached arm64-only SDL3 tree from before the
      # universal switch must not poison the fat link.
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: out/build/mac-Release/_deps
          key: deps-${{ runner.os }}-univ-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset mac-release

      - name: Build
        run: cmake --build --preset mac-release

      # The artifact must run on Intel and Apple Silicon alike.
      - name: Assert universal binary
        run: |
          lipo -archs out/build/mac-Release/bin/voxel-factory
          lipo -archs out/build/mac-Release/bin/voxel-factory | grep -q x86_64
          lipo -archs out/build/mac-Release/bin/voxel-factory | grep -q arm64

      - name: Selftest (save round-trip, headless)
        run: out/build/mac-Release/bin/voxel-factory --selftest

      # Tar first: upload-artifact's zip strips the executable bit, a tarball
      # keeps the bin folder runnable straight after download + untar.
      - name: Pack build
        run: tar -czf voxel-factory-mac.tar.gz -C out/build/mac-Release bin

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: voxel-factory-mac
          path: voxel-factory-mac.tar.gz
